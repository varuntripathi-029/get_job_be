[project]
name = "hiresignal-backend"
version = "0.1.0"
description = "HireSignal — AI hiring intelligence platform (API and workers)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Required by FastAPI for multipart uploads (resume files)
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Auth — Google OAuth only, no password libraries
    "pyjwt>=2.10.0",
    "google-auth>=2.36.0",
    "google-auth-httplib2>=0.2.0",
    # HTTP
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",
    # Parsing
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "lxml-html-clean>=0.4.0",
    "feedparser>=6.0.11",
    # Browser
    "playwright>=1.49.0",
    # Queue
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # AI / ML — the openai client also drives Groq and xAI via their
    # OpenAI-compatible endpoints. google-genai is the supported Gemini SDK;
    # google-generativeai reached end of support and is deliberately not used.
    "google-genai>=1.0.0",
    "openai>=1.59.0",
    "pgvector>=0.3.6",
    "numpy>=2.1.0",
    # Email
    "resend>=2.5.0",
    # Documents
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    # IDs
    "uuid-utils>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]
